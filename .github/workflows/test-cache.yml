name: Test binary cache selection
on:
  pull_request:
  push:
    branches: ['3.0.7']
jobs:
  cache-selection:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v3
      - name: Check same-version source selection
        shell: pwsh
        run: ./tests/test-binary-cache.ps1
      - name: Check packaged discovery metadata
        shell: pwsh
        run: |
          Install-Module powershell-yaml -Scope CurrentUser -Force
          ./scripts/test-extension-discovery.ps1
